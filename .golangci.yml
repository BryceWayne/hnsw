version: "2"

run:
  timeout: 5m

formatters:
  enable:
    - gofmt
  settings:
    gofmt:
      simplify: true

linters:
  default: standard
  enable:
    - copyloopvar
    - misspell
    - nilerr
    - predeclared
    - revive
    - unconvert
    - unparam
  settings:
    revive:
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: dot-imports
        - name: error-return
        - name: error-strings
        - name: exported
        - name: increment-decrement
        - name: indent-error-flow
        - name: package-comments
        - name: range
        - name: receiver-naming
        - name: time-naming
        - name: var-declaration
  exclusions:
    presets:
      - std-error-handling
      - common-false-positives
    rules:
      - path: _test\.go
        linters:
          - unparam
          - revive
