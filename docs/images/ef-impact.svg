<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-labelledby="title desc">
  <title id="title">Search Beam Width (EfSearch) vs. Recall and Latency</title>
  <desc id="desc">Impact of EfSearch in Go HNSW: upper layers always execute greedyStep (ef=1), while EfSearch controls only the Layer-0 beam width max(EfSearch, k). Plots real benchmark measurements from README.md (10K clustered vectors, dim=128, M=16, Mmax=32, EfConstruction=200, k=10, MetricEuclidean): Recall@10 97.7% to 100.0% and latency 8.8 to 30.4 microseconds per query.</desc>
  <defs>
    <style>
      .sans { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; }
      .mono { font-family: ui-monospace, 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', 'DejaVu Sans Mono', monospace; }
      .title { font-size: 20px; font-weight: 700; fill: #F8FAFC; }
      .subtitle { font-size: 12px; font-weight: 400; fill: #94A3B8; }
      .panel { fill: #152033; stroke: #293548; stroke-width: 1.25; }
      .panel-title { font-size: 12.5px; font-weight: 700; fill: #F8FAFC; }
      .label { font-size: 11.5px; font-weight: 500; fill: #E2E8F0; }
      .muted { font-size: 11px; font-weight: 400; fill: #94A3B8; }
      .grid { stroke: #293548; stroke-width: 1; }
      .axis { stroke: #94A3B8; stroke-width: 1.3; }
    </style>
    <marker id="arrow-cyan" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M 1 1.5 L 9 5 L 1 8.5 z" fill="#00ADD8"/>
    </marker>
  </defs>

  <!-- Outer Card -->
  <rect x="2" y="2" width="956" height="536" rx="14" fill="#0F172A" stroke="#334155" stroke-width="1.5"/>

  <!-- Header -->
  <text x="28" y="38" class="sans title">Search Beam Width (EfSearch) vs. Recall &amp; Latency</text>
  <text x="28" y="57" class="sans subtitle">Upper layers always use greedyStep (ef=1); EfSearch controls only Layer-0 beam width max(EfSearch, k)</text>

  <!-- Brand Badge Pill -->
  <rect x="764" y="21" width="168" height="36" rx="8" fill="#0B172A" stroke="#00ADD8" stroke-opacity="0.75" stroke-width="1.25"/>
  <line x1="781" y1="34" x2="793" y2="34" stroke="#38BDF8" stroke-width="1.5"/>
  <line x1="781" y1="34" x2="787" y2="45" stroke="#00ADD8" stroke-width="1.5"/>
  <line x1="793" y1="34" x2="787" y2="45" stroke="#34D399" stroke-width="1.5"/>
  <circle cx="781" cy="34" r="2.7" fill="#00ADD8"/>
  <circle cx="793" cy="34" r="2.7" fill="#38BDF8"/>
  <circle cx="787" cy="45" r="2.7" fill="#34D399"/>
  <text x="804" y="39" class="mono" font-size="14" font-weight="700" fill="#38BDF8" dominant-baseline="central">hnsw</text>
  <line x1="848" y1="29" x2="848" y2="49" stroke="#334155" stroke-width="1.2"/>
  <text x="858" y="39" class="mono" font-size="11" font-weight="600" fill="#CBD5E1" dominant-baseline="central">Go • ANN</text>

  <!-- Top Row: 3 Layer-0 Beam Comparison Cards -->
  <!-- Card 1: EfSearch = 16 -->
  <rect x="28" y="76" width="288" height="160" rx="10" class="panel"/>
  <text x="44" y="96" class="mono panel-title" fill="#FBBF24">EfSearch = 16</text>
  <text x="298" y="96" class="sans muted" text-anchor="end">Fast / Narrow</text>
  <!-- Upper Layer Greedy Strip (identical in all 3) -->
  <rect x="44" y="106" width="256" height="24" rx="5" fill="#0F172A" stroke="#293548"/>
  <text x="54" y="118" class="mono" font-size="9.5" fill="#38BDF8" dominant-baseline="central">L1+: ef=1</text>
  <circle cx="144" cy="118" r="4.5" fill="#0C4A6E" stroke="#00ADD8" stroke-width="1.5"/>
  <line x1="150" y1="118" x2="210" y2="118" stroke="#00ADD8" stroke-width="1.8" marker-end="url(#arrow-cyan)"/>
  <circle cx="220" cy="118" r="4.5" fill="#0C4A6E" stroke="#38BDF8" stroke-width="1.5"/>
  <!-- L0 Zone -->
  <rect x="44" y="135" width="256" height="76" rx="6" fill="#0F172A" stroke="#293548"/>
  <text x="54" y="149" class="mono" font-size="9.5" fill="#94A3B8">L0 beam</text>
  <ellipse cx="182" cy="176" rx="34" ry="22" fill="#3B82F6" fill-opacity="0.16" stroke="#60A5FA" stroke-width="1.3" stroke-dasharray="4 3"/>
  <circle cx="164" cy="172" r="4.5" fill="#60A5FA"/>
  <circle cx="196" cy="184" r="4.5" fill="#34D399"/>
  <circle cx="212" cy="166" r="4.5" fill="#34D399"/>
  <circle cx="242" cy="186" r="4.5" fill="#1E293B" stroke="#FBBF24" stroke-width="1.3"/>
  <circle cx="122" cy="188" r="4" fill="#475569"/>
  <polygon points="184,167 190,174 184,181 178,174" fill="#451A03" stroke="#FBBF24" stroke-width="1.5"/>
  <text x="172" y="224" class="mono" font-size="11" fill="#E2E8F0" text-anchor="middle">8.8 µs/op  •  <tspan fill="#FBBF24">97.7% Recall@10</tspan></text>

  <!-- Card 2: EfSearch = 32 -->
  <rect x="336" y="76" width="288" height="160" rx="10" class="panel"/>
  <text x="352" y="96" class="mono panel-title" fill="#60A5FA">EfSearch = 32</text>
  <text x="606" y="96" class="sans muted" text-anchor="end">Balanced</text>
  <rect x="352" y="106" width="256" height="24" rx="5" fill="#0F172A" stroke="#293548"/>
  <text x="362" y="118" class="mono" font-size="9.5" fill="#38BDF8" dominant-baseline="central">L1+: ef=1</text>
  <circle cx="452" cy="118" r="4.5" fill="#0C4A6E" stroke="#00ADD8" stroke-width="1.5"/>
  <line x1="458" y1="118" x2="518" y2="118" stroke="#00ADD8" stroke-width="1.8" marker-end="url(#arrow-cyan)"/>
  <circle cx="528" cy="118" r="4.5" fill="#0C4A6E" stroke="#38BDF8" stroke-width="1.5"/>
  <rect x="352" y="135" width="256" height="76" rx="6" fill="#0F172A" stroke="#293548"/>
  <text x="362" y="149" class="mono" font-size="9.5" fill="#94A3B8">L0 beam</text>
  <ellipse cx="490" cy="176" rx="56" ry="28" fill="#3B82F6" fill-opacity="0.16" stroke="#60A5FA" stroke-width="1.3" stroke-dasharray="4 3"/>
  <circle cx="472" cy="172" r="4.5" fill="#60A5FA"/>
  <circle cx="504" cy="184" r="4.5" fill="#34D399"/>
  <circle cx="520" cy="166" r="4.5" fill="#34D399"/>
  <circle cx="550" cy="186" r="4.5" fill="#1E293B" stroke="#FBBF24" stroke-width="1.3"/>
  <circle cx="452" cy="188" r="4.5" fill="#60A5FA"/>
  <polygon points="492,167 498,174 492,181 486,174" fill="#451A03" stroke="#FBBF24" stroke-width="1.5"/>
  <text x="480" y="224" class="mono" font-size="11" fill="#E2E8F0" text-anchor="middle">13.2 µs/op  •  <tspan fill="#60A5FA">99.6% Recall@10</tspan></text>

  <!-- Card 3: EfSearch = 64 -->
  <rect x="644" y="76" width="288" height="160" rx="10" class="panel"/>
  <text x="660" y="96" class="mono panel-title" fill="#34D399">EfSearch = 64</text>
  <text x="914" y="96" class="sans muted" text-anchor="end">Full Recall</text>
  <rect x="660" y="106" width="256" height="24" rx="5" fill="#0F172A" stroke="#293548"/>
  <text x="670" y="118" class="mono" font-size="9.5" fill="#38BDF8" dominant-baseline="central">L1+: ef=1</text>
  <circle cx="760" cy="118" r="4.5" fill="#0C4A6E" stroke="#00ADD8" stroke-width="1.5"/>
  <line x1="766" y1="118" x2="826" y2="118" stroke="#00ADD8" stroke-width="1.8" marker-end="url(#arrow-cyan)"/>
  <circle cx="836" cy="118" r="4.5" fill="#0C4A6E" stroke="#38BDF8" stroke-width="1.5"/>
  <rect x="660" y="135" width="256" height="76" rx="6" fill="#0F172A" stroke="#293548"/>
  <text x="670" y="149" class="mono" font-size="9.5" fill="#94A3B8">L0 beam</text>
  <ellipse cx="798" cy="176" rx="82" ry="32" fill="#10B981" fill-opacity="0.13" stroke="#34D399" stroke-width="1.4" stroke-dasharray="4 3"/>
  <circle cx="780" cy="172" r="4.5" fill="#60A5FA"/>
  <circle cx="812" cy="184" r="4.5" fill="#34D399"/>
  <circle cx="828" cy="166" r="4.5" fill="#34D399"/>
  <circle cx="858" cy="186" r="4.5" fill="#34D399"/>
  <circle cx="742" cy="186" r="4.5" fill="#60A5FA"/>
  <polygon points="800,167 806,174 800,181 794,174" fill="#451A03" stroke="#FBBF24" stroke-width="1.5"/>
  <text x="788" y="224" class="mono" font-size="11" fill="#E2E8F0" text-anchor="middle">19.7 µs/op  •  <tspan fill="#34D399">100.0% Recall@10</tspan></text>

  <!-- Bottom Dual-Axis Benchmark Chart -->
  <rect x="28" y="248" width="904" height="224" rx="10" class="panel"/>
  <text x="46" y="268" class="sans panel-title">Measured Tradeoff <tspan class="mono muted" font-weight="400">(10K × dim=128, M=16, Mmax=32, EfConstruction=200, k=10, L2)</tspan></text>
  <rect x="726" y="255" width="190" height="22" rx="6" fill="#0B172A" stroke="#34D399" stroke-opacity="0.5"/>
  <text x="821" y="266" class="mono" font-size="10" fill="#34D399" text-anchor="middle" dominant-baseline="central">1–2 allocs (0 SearchInto)</text>

  <!-- Plot Gridlines (x=110..810, y=304..424) -->
  <line x1="110" y1="304" x2="810" y2="304" class="grid"/>
  <line x1="110" y1="334" x2="810" y2="334" class="grid"/>
  <line x1="110" y1="364" x2="810" y2="364" class="grid"/>
  <line x1="110" y1="394" x2="810" y2="394" class="grid"/>
  <line x1="110" y1="424" x2="810" y2="424" class="axis"/>
  <!-- Left & Right Y Axes -->
  <line x1="110" y1="304" x2="110" y2="424" stroke="#34D399" stroke-width="1.4"/>
  <line x1="810" y1="304" x2="810" y2="424" stroke="#FB7185" stroke-width="1.4"/>

  <!-- Left Y Labels (Recall@10: 97%..100%) -->
  <text x="102" y="304" class="mono" font-size="10.5" fill="#34D399" text-anchor="end" dominant-baseline="central">100.0%</text>
  <text x="102" y="344" class="mono" font-size="10.5" fill="#34D399" text-anchor="end" dominant-baseline="central">99.0%</text>
  <text x="102" y="384" class="mono" font-size="10.5" fill="#34D399" text-anchor="end" dominant-baseline="central">98.0%</text>
  <text x="102" y="424" class="mono" font-size="10.5" fill="#34D399" text-anchor="end" dominant-baseline="central">97.0%</text>

  <!-- Right Y Labels (Latency: 0..32 µs) -->
  <text x="818" y="304" class="mono" font-size="10.5" fill="#FB7185" dominant-baseline="central">32 µs</text>
  <text x="818" y="334" class="mono" font-size="10.5" fill="#FB7185" dominant-baseline="central">24 µs</text>
  <text x="818" y="364" class="mono" font-size="10.5" fill="#FB7185" dominant-baseline="central">16 µs</text>
  <text x="818" y="394" class="mono" font-size="10.5" fill="#FB7185" dominant-baseline="central">8 µs</text>
  <text x="818" y="424" class="mono" font-size="10.5" fill="#FB7185" dominant-baseline="central">0 µs</text>

  <!-- X-Axis Ticks & Labels (195, 375, 555, 735) -->
  <line x1="195" y1="424" x2="195" y2="429" class="axis"/>
  <line x1="375" y1="424" x2="375" y2="429" class="axis"/>
  <line x1="555" y1="304" x2="555" y2="429" stroke="#00ADD8" stroke-opacity="0.45" stroke-width="1.3" stroke-dasharray="4 3"/>
  <line x1="735" y1="424" x2="735" y2="429" class="axis"/>

  <text x="195" y="442" class="mono label" text-anchor="middle">EfSearch = 16</text>
  <text x="375" y="442" class="mono label" text-anchor="middle">EfSearch = 32</text>
  <text x="555" y="442" class="mono label" fill="#38BDF8" text-anchor="middle">EfSearch = 64</text>
  <text x="735" y="442" class="mono label" text-anchor="middle">EfSearch = 128</text>

  <!-- Recall@10 Curve (Emerald): (195,396), (375,320), (555,304), (735,304) -->
  <polyline points="195,396 375,320 555,304 735,304" fill="none" stroke="#34D399" stroke-width="2.6" stroke-linejoin="round"/>
  <circle cx="195" cy="396" r="4.8" fill="#0F172A" stroke="#34D399" stroke-width="2.4"/>
  <circle cx="375" cy="320" r="4.8" fill="#0F172A" stroke="#34D399" stroke-width="2.4"/>
  <circle cx="555" cy="304" r="4.8" fill="#0F172A" stroke="#34D399" stroke-width="2.4"/>
  <circle cx="735" cy="304" r="4.8" fill="#0F172A" stroke="#34D399" stroke-width="2.4"/>

  <text x="195" y="413" class="mono" font-size="10.5" font-weight="700" fill="#34D399" text-anchor="middle">97.7%</text>
  <rect x="355" y="300" width="40" height="14" rx="3" fill="#152033"/>
  <text x="375" y="307" class="mono" font-size="10.5" font-weight="700" fill="#34D399" text-anchor="middle" dominant-baseline="central">99.6%</text>
  <text x="555" y="292" class="mono" font-size="10.5" font-weight="700" fill="#34D399" text-anchor="middle">100.0%</text>
  <text x="735" y="292" class="mono" font-size="10.5" font-weight="700" fill="#34D399" text-anchor="middle">100.0%</text>

  <!-- Latency Curve (Rose): (195,391), (375,374.5), (555,350.1), (735,310) -->
  <polyline points="195,391 375,374.5 555,350.1 735,310" fill="none" stroke="#FB7185" stroke-width="2.6" stroke-linejoin="round"/>
  <circle cx="195" cy="391" r="4.8" fill="#0F172A" stroke="#FB7185" stroke-width="2.4"/>
  <circle cx="375" cy="374.5" r="4.8" fill="#0F172A" stroke="#FB7185" stroke-width="2.4"/>
  <circle cx="555" cy="350.1" r="4.8" fill="#0F172A" stroke="#FB7185" stroke-width="2.4"/>
  <circle cx="735" cy="310" r="4.8" fill="#0F172A" stroke="#FB7185" stroke-width="2.4"/>

  <text x="195" y="378" class="mono" font-size="10.5" font-weight="700" fill="#FB7185" text-anchor="middle">8.8 µs</text>
  <rect x="349" y="382" width="52" height="14" rx="3" fill="#152033"/>
  <text x="375" y="389" class="mono" font-size="10.5" font-weight="700" fill="#FB7185" text-anchor="middle" dominant-baseline="central">13.2 µs</text>
  <rect x="562" y="366" width="52" height="15" rx="3" fill="#152033"/>
  <text x="588" y="373.5" class="mono" font-size="10.5" font-weight="700" fill="#FB7185" text-anchor="middle" dominant-baseline="central">19.7 µs</text>
  <text x="735" y="328" class="mono" font-size="10.5" font-weight="700" fill="#FB7185" text-anchor="middle">30.4 µs</text>

  <!-- Sweet Spot Callout -->
  <rect x="574" y="385" width="218" height="24" rx="5" fill="#0C4A6E" stroke="#00ADD8" stroke-opacity="0.7"/>
  <text x="683" y="397" class="mono" font-size="10" fill="#7DD3FC" text-anchor="middle" dominant-baseline="central">Ef=64: 100% Recall @ 19.7 µs</text>

  <!-- Build vs Search Note -->
  <text x="480" y="462" class="sans muted" text-anchor="middle">Build-time <tspan class="mono" fill="#CBD5E1">EfConstruction</tspan> (default 200) shapes graph edges; runtime <tspan class="mono" fill="#38BDF8">EfSearch</tspan> (default 50) tunes L0 beam.</text>

  <!-- Footer Legend Bar -->
  <rect x="28" y="484" width="904" height="34" rx="8" class="panel"/>
  <line x1="44" y1="501" x2="70" y2="501" stroke="#34D399" stroke-width="2.6"/>
  <text x="78" y="501" class="sans label" dominant-baseline="central">Recall@10 (%)</text>

  <line x1="186" y1="501" x2="212" y2="501" stroke="#FB7185" stroke-width="2.6"/>
  <text x="220" y="501" class="sans label" dominant-baseline="central">Latency (µs/op)</text>

  <line x1="338" y1="501" x2="364" y2="501" stroke="#00ADD8" stroke-width="2" marker-end="url(#arrow-cyan)"/>
  <text x="372" y="501" class="sans label" dominant-baseline="central">Upper L1+ Greedy (ef=1)</text>

  <ellipse cx="556" cy="501" rx="11" ry="6" fill="#3B82F6" fill-opacity="0.2" stroke="#60A5FA" stroke-width="1.3" stroke-dasharray="3 2"/>
  <text x="575" y="501" class="sans label" dominant-baseline="central">L0 Beam max(EfSearch, k)</text>

  <polygon points="770,495 776,501 770,507 764,501" fill="#451A03" stroke="#FBBF24" stroke-width="1.5"/>
  <text x="784" y="501" class="sans label" dominant-baseline="central">Query Target q</text>
</svg>
