<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-labelledby="title desc">
  <title id="title">HNSW Insertion, Atomic Upsert and Bidirectional Linking</title>
  <desc id="desc">Insert(id, vec) in Go: tryInsertFast vs exclusive atomic upsert (deleteInternal + allocSlot with separate invNorms for MetricCosine), randomLevel sampling via mL=1/ln(M), greedyStep down to newLevel+1, searchLayerInsert with EfConstruction=200 and bidirectional intra-layer linking, plus entryState CAS promotion.</desc>
  <defs>
    <style>
      .sans { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; }
      .mono { font-family: ui-monospace, 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', 'DejaVu Sans Mono', monospace; }
      .title { font-size: 20px; font-weight: 700; fill: #F8FAFC; }
      .subtitle { font-size: 12px; font-weight: 400; fill: #94A3B8; }
      .panel { fill: #152033; stroke: #293548; stroke-width: 1.25; }
      .panel-title { font-size: 12.5px; font-weight: 700; fill: #F8FAFC; }
      .label { font-size: 11.5px; font-weight: 500; fill: #E2E8F0; }
      .muted { font-size: 11px; font-weight: 400; fill: #94A3B8; }
      .node-id { font-size: 10.5px; font-weight: 700; fill: #F8FAFC; text-anchor: middle; dominant-baseline: central; }
      .edge-base { stroke: #475569; stroke-width: 1.3; fill: none; }
      .proj-line { stroke: #475569; stroke-width: 1.3; stroke-dasharray: 4 3; fill: none; }
      .greedy-path { stroke: #00ADD8; stroke-width: 2.3; fill: none; }
      .bidir-edge { stroke: #34D399; stroke-width: 2.1; fill: none; }
    </style>
    <marker id="arrow-cyan" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7.5" markerHeight="7.5" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M 1 1.5 L 9 5 L 1 8.5 z" fill="#00ADD8"/>
    </marker>
    <marker id="arrow-emerald" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M 1 1.5 L 9 5 L 1 8.5 z" fill="#34D399"/>
    </marker>
  </defs>

  <!-- Outer Card -->
  <rect x="2" y="2" width="956" height="536" rx="14" fill="#0F172A" stroke="#334155" stroke-width="1.5"/>

  <!-- Header -->
  <text x="28" y="38" class="sans title">Insertion, Atomic Upsert &amp; Bidirectional Linking</text>
  <text x="28" y="57" class="sans subtitle">Insert(id, vec): fast path or atomic upsert, mL level sampling, greedy descent, and Algorithm 4 linking</text>

  <!-- Brand Badge Pill -->
  <rect x="764" y="21" width="168" height="36" rx="8" fill="#0B172A" stroke="#00ADD8" stroke-opacity="0.75" stroke-width="1.25"/>
  <line x1="781" y1="34" x2="793" y2="34" stroke="#38BDF8" stroke-width="1.5"/>
  <line x1="781" y1="34" x2="787" y2="45" stroke="#00ADD8" stroke-width="1.5"/>
  <line x1="793" y1="34" x2="787" y2="45" stroke="#34D399" stroke-width="1.5"/>
  <circle cx="781" cy="34" r="2.7" fill="#00ADD8"/>
  <circle cx="793" cy="34" r="2.7" fill="#38BDF8"/>
  <circle cx="787" cy="45" r="2.7" fill="#34D399"/>
  <text x="804" y="39" class="mono" font-size="14" font-weight="700" fill="#38BDF8" dominant-baseline="central">hnsw</text>
  <line x1="848" y1="29" x2="848" y2="49" stroke="#334155" stroke-width="1.2"/>
  <text x="858" y="39" class="mono" font-size="11" font-weight="600" fill="#CBD5E1" dominant-baseline="central">Go • ANN</text>

  <!-- Left 4-Stage Pipeline Strip -->
  <!-- Stage 1 -->
  <rect x="28" y="78" width="290" height="90" rx="10" class="panel"/>
  <circle cx="50" cy="100" r="10" fill="#0C4A6E" stroke="#00ADD8" stroke-width="1.2"/>
  <text x="50" y="100" class="mono" font-size="11" font-weight="700" fill="#7DD3FC" text-anchor="middle" dominant-baseline="central">1</text>
  <text x="68" y="100" class="sans panel-title" dominant-baseline="central">Validate &amp; Atomic Upsert</text>
  <text x="42" y="123" class="sans label">New key: <tspan class="mono" fill="#38BDF8">tryInsertFast</tspan> + <tspan class="mono">allocSlot</tspan></text>
  <text x="42" y="141" class="sans muted">Existing key: <tspan class="mono" fill="#FB7185">deleteInternal</tspan> + new slot</text>
  <text x="42" y="158" class="sans muted">Store <tspan class="mono">invNorms</tspan> separately (lossless <tspan class="mono">Get</tspan>)</text>

  <!-- Stage 2 -->
  <rect x="28" y="178" width="290" height="84" rx="10" class="panel"/>
  <circle cx="50" cy="200" r="10" fill="#064E3B" stroke="#34D399" stroke-width="1.2"/>
  <text x="50" y="200" class="mono" font-size="11" font-weight="700" fill="#34D399" text-anchor="middle" dominant-baseline="central">2</text>
  <text x="68" y="200" class="sans panel-title" dominant-baseline="central">Sample Level (randomLevel)</text>
  <text x="42" y="223" class="mono label" fill="#34D399">lvl = ⌊-ln(U) · mL⌋, mL = 1/ln(M)</text>
  <text x="42" y="242" class="sans muted">Clamped ≤ 32 • Example: <tspan class="mono" fill="#34D399">newLevel = L1</tspan></text>

  <!-- Stage 3 -->
  <rect x="28" y="272" width="290" height="86" rx="10" class="panel"/>
  <circle cx="50" cy="294" r="10" fill="#0C4A6E" stroke="#00ADD8" stroke-width="1.2"/>
  <text x="50" y="294" class="mono" font-size="11" font-weight="700" fill="#7DD3FC" text-anchor="middle" dominant-baseline="central">3</text>
  <text x="68" y="294" class="sans panel-title" dominant-baseline="central">Greedy Descent (L &gt; newLevel)</text>
  <text x="42" y="317" class="sans label">From <tspan class="mono" fill="#38BDF8">entryState</tspan> down to <tspan class="mono">newLevel+1</tspan></text>
  <text x="42" y="336" class="sans muted">Single <tspan class="mono">greedyStep</tspan> path (<tspan class="mono">ef = 1</tspan>)</text>

  <!-- Stage 4 -->
  <rect x="28" y="368" width="290" height="104" rx="10" class="panel"/>
  <circle cx="50" cy="390" r="10" fill="#064E3B" stroke="#34D399" stroke-width="1.2"/>
  <text x="50" y="390" class="mono" font-size="11" font-weight="700" fill="#34D399" text-anchor="middle" dominant-baseline="central">4</text>
  <text x="68" y="390" class="sans panel-title" dominant-baseline="central">Link &amp; Promote (newLevel..0)</text>
  <text x="42" y="413" class="mono label" fill="#60A5FA">searchLayerInsert(..., ef=200)</text>
  <text x="42" y="432" class="sans muted"><tspan class="mono" fill="#34D399">setNeighbors</tspan> before <tspan class="mono" fill="#34D399">addConnection</tspan> (↔)</text>
  <text x="42" y="451" class="sans muted">CAS <tspan class="mono" fill="#38BDF8">entryState</tspan> if <tspan class="mono">newLevel &gt; entryLevel</tspan></text>

  <!-- Right Multi-Layer Graph -->
  <!-- Layer 2 -->
  <rect x="334" y="78" width="598" height="102" rx="10" class="panel"/>
  <rect x="348" y="90" width="34" height="20" rx="5" fill="#0C4A6E" stroke="#00ADD8" stroke-width="1.1"/>
  <text x="365" y="100" class="mono" font-size="11" font-weight="700" fill="#7DD3FC" text-anchor="middle" dominant-baseline="central">L2</text>
  <text x="390" y="100" class="sans label" dominant-baseline="central">Above newLevel (greedyStep only)</text>
  <rect x="706" y="88" width="212" height="22" rx="5" fill="#0B172A" stroke="#334155"/>
  <text x="812" y="99" class="mono" font-size="10" fill="#94A3B8" text-anchor="middle" dominant-baseline="central">CAS entryState if newLevel &gt; L2</text>

  <!-- Layer 1 -->
  <rect x="334" y="194" width="598" height="118" rx="10" class="panel"/>
  <rect x="348" y="206" width="34" height="20" rx="5" fill="#064E3B" stroke="#34D399" stroke-width="1.1"/>
  <text x="365" y="216" class="mono" font-size="11" font-weight="700" fill="#34D399" text-anchor="middle" dominant-baseline="central">L1</text>

  <!-- Layer 0 -->
  <rect x="334" y="326" width="598" height="146" rx="10" class="panel"/>
  <rect x="348" y="338" width="34" height="20" rx="5" fill="#064E3B" stroke="#34D399" stroke-width="1.1"/>
  <text x="365" y="348" class="mono" font-size="11" font-weight="700" fill="#34D399" text-anchor="middle" dominant-baseline="central">L0</text>

  <!-- Vertical Same-Node Projections -->
  <line x1="422" y1="150" x2="422" y2="242" class="proj-line"/>
  <line x1="422" y1="270" x2="422" y2="394" class="proj-line"/>
  <line x1="592" y1="270" x2="592" y2="378" class="proj-line"/>
  <line x1="818" y1="276" x2="818" y2="386" class="proj-line"/>
  <!-- x_new vertical identity projection between L1 and L0 -->
  <line x1="706" y1="274" x2="706" y2="388" stroke="#34D399" stroke-width="1.6" stroke-dasharray="4 3"/>
  <rect x="716" y="310" width="90" height="16" rx="4" fill="#0B172A" stroke="#34D399" stroke-opacity="0.5"/>
  <text x="761" y="318" class="mono" font-size="9.5" fill="#34D399" text-anchor="middle" dominant-baseline="central">same x_new ID</text>

  <!-- Layer 1 & Layer 0 Titles (drawn above projection lines with panel-matched backdrops) -->
  <rect x="386" y="206" width="178" height="20" fill="#152033"/>
  <text x="390" y="216" class="sans label" dominant-baseline="central">newLevel = 1 • Link ≤ M (16)</text>
  <rect x="386" y="338" width="190" height="20" fill="#152033"/>
  <text x="390" y="348" class="sans label" dominant-baseline="central">Base Layer • Link ≤ Mmax (32)</text>

  <!-- L2 Graph -->
  <line x1="438" y1="136" x2="574" y2="136" class="greedy-path" marker-end="url(#arrow-cyan)"/>
  <line x1="592" y1="151" x2="592" y2="239" class="greedy-path" stroke-dasharray="5 3" marker-end="url(#arrow-cyan)"/>
  <rect x="602" y="172" width="68" height="16" rx="4" fill="#0B172A" stroke="#00ADD8" stroke-opacity="0.6"/>
  <text x="636" y="180" class="mono" font-size="9.5" fill="#38BDF8" text-anchor="middle" dominant-baseline="central">drop L2→L1</text>

  <circle cx="422" cy="136" r="18" fill="none" stroke="#00ADD8" stroke-opacity="0.35" stroke-width="1.4"/>
  <circle cx="422" cy="136" r="14" fill="#0C4A6E" stroke="#00ADD8" stroke-width="2.2"/>
  <text x="422" y="136" class="mono node-id">v2</text>
  <rect x="344" y="155" width="72" height="17" rx="4" fill="#0C4A6E" stroke="#00ADD8" stroke-width="1"/>
  <text x="380" y="163.5" class="mono" font-size="9.5" fill="#7DD3FC" text-anchor="middle" dominant-baseline="central">entryState</text>

  <circle cx="592" cy="136" r="14" fill="#0C4A6E" stroke="#38BDF8" stroke-width="2"/>
  <text x="592" y="136" class="mono node-id">v6</text>

  <!-- L1 Graph -->
  <line x1="422" y1="256" x2="592" y2="256" class="edge-base"/>
  <line x1="592" y1="256" x2="818" y2="262" class="edge-base"/>
  <!-- Intra-layer bidirectional links to x_new in L1 -->
  <line x1="609" y1="256" x2="687" y2="256" class="bidir-edge" marker-start="url(#arrow-emerald)" marker-end="url(#arrow-emerald)"/>
  <line x1="725" y1="256" x2="801" y2="261" class="bidir-edge" marker-start="url(#arrow-emerald)" marker-end="url(#arrow-emerald)"/>
  <text x="706" y="227" class="mono" font-size="10" fill="#34D399" text-anchor="middle">efConstruction=200 • Alg. 4</text>

  <circle cx="422" cy="256" r="13" fill="#1E293B" stroke="#64748B" stroke-width="1.6"/>
  <text x="422" y="256" class="mono node-id">v2</text>
  <circle cx="592" cy="256" r="13" fill="#0C4A6E" stroke="#38BDF8" stroke-width="2"/>
  <text x="592" y="256" class="mono node-id">v6</text>
  <circle cx="818" cy="262" r="13" fill="#1E293B" stroke="#64748B" stroke-width="1.6"/>
  <text x="818" y="262" class="mono node-id">v8</text>

  <circle cx="706" cy="256" r="20" fill="none" stroke="#34D399" stroke-opacity="0.35" stroke-width="1.4"/>
  <circle cx="706" cy="256" r="15" fill="#064E3B" stroke="#34D399" stroke-width="2.2"/>
  <text x="706" y="256" class="mono node-id">new</text>

  <!-- L0 Background Edges -->
  <line x1="422" y1="408" x2="508" y2="394" class="edge-base"/>
  <line x1="422" y1="408" x2="492" y2="444" class="edge-base"/>
  <line x1="508" y1="394" x2="592" y2="392" class="edge-base"/>
  <line x1="492" y1="444" x2="592" y2="392" class="edge-base"/>
  <line x1="492" y1="444" x2="604" y2="446" class="edge-base"/>
  <line x1="592" y1="392" x2="604" y2="446" class="edge-base"/>
  <line x1="818" y1="400" x2="884" y2="430" class="edge-base"/>
  <line x1="786" y1="446" x2="884" y2="430" class="edge-base"/>

  <!-- L0 Bidirectional Intra-Layer Links to x_new (706, 406) -->
  <line x1="609" y1="394" x2="687" y2="404" class="bidir-edge" marker-start="url(#arrow-emerald)" marker-end="url(#arrow-emerald)"/>
  <line x1="620" y1="440" x2="689" y2="413" class="bidir-edge" marker-start="url(#arrow-emerald)" marker-end="url(#arrow-emerald)"/>
  <line x1="725" y1="405" x2="801" y2="401" class="bidir-edge" marker-start="url(#arrow-emerald)" marker-end="url(#arrow-emerald)"/>
  <line x1="722" y1="416" x2="770" y2="439" class="bidir-edge" marker-start="url(#arrow-emerald)" marker-end="url(#arrow-emerald)"/>

  <circle cx="422" cy="408" r="13" fill="#1E293B" stroke="#64748B" stroke-width="1.6"/>
  <text x="422" y="408" class="mono node-id">v2</text>
  <circle cx="508" cy="394" r="13" fill="#1E293B" stroke="#64748B" stroke-width="1.6"/>
  <text x="508" y="394" class="mono node-id">v3</text>
  <circle cx="492" cy="444" r="13" fill="#1E293B" stroke="#64748B" stroke-width="1.6"/>
  <text x="492" y="444" class="mono node-id">v4</text>
  <circle cx="592" cy="392" r="13" fill="#1E293B" stroke="#64748B" stroke-width="1.6"/>
  <text x="592" y="392" class="mono node-id">v6</text>
  <circle cx="604" cy="446" r="13" fill="#1E293B" stroke="#64748B" stroke-width="1.6"/>
  <text x="604" y="446" class="mono node-id">v7</text>
  <circle cx="786" cy="446" r="13" fill="#1E293B" stroke="#64748B" stroke-width="1.6"/>
  <text x="786" y="446" class="mono node-id">v9</text>
  <circle cx="818" cy="400" r="13" fill="#1E293B" stroke="#64748B" stroke-width="1.6"/>
  <text x="818" y="400" class="mono node-id">v8</text>
  <circle cx="884" cy="430" r="13" fill="#1E293B" stroke="#64748B" stroke-width="1.6"/>
  <text x="884" y="430" class="mono node-id">v10</text>

  <circle cx="706" cy="406" r="20" fill="none" stroke="#34D399" stroke-opacity="0.35" stroke-width="1.4"/>
  <circle cx="706" cy="406" r="15" fill="#064E3B" stroke="#34D399" stroke-width="2.2"/>
  <text x="706" y="406" class="mono node-id">new</text>

  <!-- Footer Legend Bar -->
  <rect x="28" y="484" width="904" height="34" rx="8" class="panel"/>
  <circle cx="48" cy="501" r="6" fill="#0C4A6E" stroke="#00ADD8" stroke-width="2"/>
  <text x="60" y="501" class="mono label" dominant-baseline="central">entryState</text>

  <circle cx="156" cy="501" r="6" fill="#064E3B" stroke="#34D399" stroke-width="2"/>
  <text x="168" y="501" class="sans label" dominant-baseline="central">New Node (x_new)</text>

  <line x1="298" y1="501" x2="324" y2="501" stroke="#00ADD8" stroke-width="2.3" marker-end="url(#arrow-cyan)"/>
  <text x="332" y="501" class="sans label" dominant-baseline="central">Greedy Descent (L &gt; newLevel)</text>

  <line x1="538" y1="501" x2="568" y2="501" stroke="#34D399" stroke-width="2.1" marker-start="url(#arrow-emerald)" marker-end="url(#arrow-emerald)"/>
  <text x="576" y="501" class="sans label" dominant-baseline="central">Bidirectional Link (↔, Alg. 4)</text>

  <line x1="766" y1="501" x2="790" y2="501" stroke="#475569" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="798" y="501" class="sans label" dominant-baseline="central">Node Projection</text>
</svg>
