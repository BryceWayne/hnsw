<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-labelledby="title desc">
  <title id="title">HNSW Two-Phase Search and Zero-Alloc Scratch</title>
  <desc id="desc">Search(query, k) and SearchInto in Go: Phase 1 greedyStep from entryState down MaxLevel..1 (ef=1), Phase 2 Layer-0 beam search with ef=max(EfSearch, k) using pooled searchScratch, traversing tombstoned or filtered nodes without returning them in results.</desc>
  <defs>
    <style>
      .sans { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; }
      .mono { font-family: ui-monospace, 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', 'DejaVu Sans Mono', monospace; }
      .title { font-size: 20px; font-weight: 700; fill: #F8FAFC; }
      .subtitle { font-size: 12px; font-weight: 400; fill: #94A3B8; }
      .panel { fill: #152033; stroke: #293548; stroke-width: 1.25; }
      .panel-title { font-size: 12.5px; font-weight: 700; fill: #F8FAFC; }
      .label { font-size: 11.5px; font-weight: 500; fill: #E2E8F0; }
      .muted { font-size: 11px; font-weight: 400; fill: #94A3B8; }
      .node-id { font-size: 10.5px; font-weight: 700; fill: #F8FAFC; text-anchor: middle; dominant-baseline: central; }
      .edge-base { stroke: #475569; stroke-width: 1.3; fill: none; }
      .proj-line { stroke: #475569; stroke-width: 1.3; stroke-dasharray: 4 3; fill: none; }
      .greedy-path { stroke: #00ADD8; stroke-width: 2.4; fill: none; }
      .beam-path { stroke: #60A5FA; stroke-width: 2.1; fill: none; }
    </style>
    <marker id="arrow-cyan" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7.5" markerHeight="7.5" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M 1 1.5 L 9 5 L 1 8.5 z" fill="#00ADD8"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M 1 1.5 L 9 5 L 1 8.5 z" fill="#60A5FA"/>
    </marker>
  </defs>

  <!-- Outer Card -->
  <rect x="2" y="2" width="956" height="536" rx="14" fill="#0F172A" stroke="#334155" stroke-width="1.5"/>

  <!-- Header -->
  <text x="28" y="38" class="sans title">Two-Phase Search &amp; Zero-Alloc Scratch</text>
  <text x="28" y="57" class="sans subtitle">Search(query, k) / SearchInto: greedyStep upper descent (ef=1) then Layer-0 beam search (ef = max(EfSearch, k))</text>

  <!-- Brand Badge Pill -->
  <rect x="764" y="21" width="168" height="36" rx="8" fill="#0B172A" stroke="#00ADD8" stroke-opacity="0.75" stroke-width="1.25"/>
  <line x1="781" y1="34" x2="793" y2="34" stroke="#38BDF8" stroke-width="1.5"/>
  <line x1="781" y1="34" x2="787" y2="45" stroke="#00ADD8" stroke-width="1.5"/>
  <line x1="793" y1="34" x2="787" y2="45" stroke="#34D399" stroke-width="1.5"/>
  <circle cx="781" cy="34" r="2.7" fill="#00ADD8"/>
  <circle cx="793" cy="34" r="2.7" fill="#38BDF8"/>
  <circle cx="787" cy="45" r="2.7" fill="#34D399"/>
  <text x="804" y="39" class="mono" font-size="14" font-weight="700" fill="#38BDF8" dominant-baseline="central">hnsw</text>
  <line x1="848" y1="29" x2="848" y2="49" stroke="#334155" stroke-width="1.2"/>
  <text x="858" y="39" class="mono" font-size="11" font-weight="600" fill="#CBD5E1" dominant-baseline="central">Go • ANN</text>

  <!-- Left Graph Area -->
  <!-- Layer 2 -->
  <rect x="28" y="78" width="596" height="98" rx="10" class="panel"/>
  <rect x="40" y="90" width="32" height="20" rx="5" fill="#0C4A6E" stroke="#00ADD8" stroke-width="1.1"/>
  <text x="56" y="100" class="mono" font-size="11" font-weight="700" fill="#7DD3FC" text-anchor="middle" dominant-baseline="central">L2</text>
  <text x="80" y="100" class="sans label" dominant-baseline="central">Phase 1: greedyStep (ef=1)</text>

  <!-- Layer 1 -->
  <rect x="28" y="190" width="596" height="104" rx="10" class="panel"/>
  <rect x="40" y="202" width="32" height="20" rx="5" fill="#0C4A6E" stroke="#00ADD8" stroke-width="1.1"/>
  <text x="56" y="212" class="mono" font-size="11" font-weight="700" fill="#7DD3FC" text-anchor="middle" dominant-baseline="central">L1</text>

  <!-- Layer 0 -->
  <rect x="28" y="308" width="596" height="164" rx="10" class="panel"/>
  <rect x="40" y="320" width="32" height="20" rx="5" fill="#1E3A8A" stroke="#60A5FA" stroke-width="1.1"/>
  <text x="56" y="330" class="mono" font-size="11" font-weight="700" fill="#93C5FD" text-anchor="middle" dominant-baseline="central">L0</text>

  <!-- Vertical Same-Node Identity Projections -->
  <line x1="142" y1="149" x2="142" y2="236" class="proj-line"/>
  <line x1="142" y1="264" x2="142" y2="394" class="proj-line"/>
  <line x1="306" y1="264" x2="306" y2="366" class="proj-line"/>
  <line x1="434" y1="268" x2="434" y2="372" class="proj-line"/>
  <line x1="544" y1="264" x2="544" y2="354" class="proj-line"/>

  <!-- Layer 1 & Layer 0 Titles (drawn above projection lines with panel-matched backdrops) -->
  <rect x="76" y="202" width="168" height="20" fill="#152033"/>
  <text x="80" y="212" class="sans label" dominant-baseline="central">Phase 1: greedyStep (ef=1)</text>
  <rect x="76" y="320" width="278" height="20" fill="#152033"/>
  <text x="80" y="330" class="sans label" dominant-baseline="central">Phase 2: Beam Search (ef = max(EfSearch, k))</text>

  <!-- L0 Beam Frontier Highlight -->
  <ellipse cx="478" cy="404" rx="122" ry="56" fill="#3B82F6" fill-opacity="0.10" stroke="#60A5FA" stroke-opacity="0.45" stroke-width="1.25" stroke-dasharray="5 4"/>

  <!-- Query target q in L0 -->
  <circle cx="516" cy="404" r="24" fill="none" stroke="#FBBF24" stroke-opacity="0.35" stroke-width="1.2" stroke-dasharray="3 3"/>
  <polygon points="516,392 526,404 516,416 506,404" fill="#451A03" stroke="#FBBF24" stroke-width="2"/>
  <text x="516" y="404" class="mono" font-size="11" font-weight="700" fill="#FBBF24" text-anchor="middle" dominant-baseline="central">q</text>

  <!-- L2 Edges & Nodes -->
  <line x1="158" y1="134" x2="288" y2="134" class="greedy-path" marker-end="url(#arrow-cyan)"/>
  <text x="223" y="122" class="mono" font-size="10.5" fill="#38BDF8" text-anchor="middle">d &lt; currDist</text>
  <!-- Drop L2 -> L1 at v5 (x=306) -->
  <line x1="306" y1="150" x2="306" y2="234" class="greedy-path" stroke-dasharray="5 3" marker-end="url(#arrow-cyan)"/>
  <rect x="314" y="169" width="66" height="17" rx="4" fill="#0B172A" stroke="#00ADD8" stroke-opacity="0.6"/>
  <text x="347" y="178" class="mono" font-size="10" fill="#38BDF8" text-anchor="middle" dominant-baseline="central">drop L2→L1</text>

  <circle cx="142" cy="134" r="18" fill="none" stroke="#00ADD8" stroke-opacity="0.35" stroke-width="1.4"/>
  <circle cx="142" cy="134" r="14" fill="#0C4A6E" stroke="#00ADD8" stroke-width="2.2"/>
  <text x="142" y="134" class="mono node-id">v2</text>
  <rect x="70" y="152" width="68" height="16" rx="4" fill="#0C4A6E"/>
  <text x="104" y="160" class="mono" font-size="9.5" fill="#7DD3FC" text-anchor="middle" dominant-baseline="central">entryState</text>

  <circle cx="306" cy="134" r="14" fill="#0C4A6E" stroke="#38BDF8" stroke-width="2"/>
  <text x="306" y="134" class="mono node-id">v5</text>

  <!-- L1 Background Edges & Greedy Path -->
  <line x1="142" y1="250" x2="306" y2="250" class="edge-base"/>
  <line x1="434" y1="254" x2="544" y2="250" class="edge-base"/>
  <line x1="321" y1="250" x2="418" y2="254" class="greedy-path" marker-end="url(#arrow-cyan)"/>
  <text x="370" y="238" class="mono" font-size="10.5" fill="#38BDF8" text-anchor="middle">local min</text>
  <!-- Drop L1 -> L0 at v7 (x=434) -->
  <line x1="434" y1="269" x2="434" y2="370" class="greedy-path" stroke-dasharray="5 3" marker-end="url(#arrow-cyan)"/>
  <rect x="442" y="294" width="66" height="17" rx="4" fill="#0B172A" stroke="#00ADD8" stroke-opacity="0.6"/>
  <text x="475" y="303" class="mono" font-size="10" fill="#38BDF8" text-anchor="middle" dominant-baseline="central">drop L1→L0</text>

  <circle cx="142" cy="250" r="13" fill="#1E293B" stroke="#64748B" stroke-width="1.6"/>
  <text x="142" y="250" class="mono node-id">v2</text>
  <circle cx="306" cy="250" r="13" fill="#0C4A6E" stroke="#38BDF8" stroke-width="2"/>
  <text x="306" y="250" class="mono node-id">v5</text>
  <circle cx="434" cy="254" r="13" fill="#0C4A6E" stroke="#38BDF8" stroke-width="2"/>
  <text x="434" y="254" class="mono node-id">v7</text>
  <circle cx="544" cy="250" r="13" fill="#1E293B" stroke="#64748B" stroke-width="1.6"/>
  <text x="544" y="250" class="mono node-id">v9</text>

  <!-- L0 Background Edges -->
  <line x1="86" y1="418" x2="142" y2="408" class="edge-base"/>
  <line x1="142" y1="408" x2="226" y2="438" class="edge-base"/>
  <line x1="142" y1="408" x2="306" y2="380" class="edge-base"/>
  <line x1="226" y1="438" x2="306" y2="380" class="edge-base"/>
  <line x1="226" y1="438" x2="352" y2="438" class="edge-base"/>
  <line x1="306" y1="380" x2="434" y2="386" class="edge-base"/>
  <line x1="352" y1="438" x2="434" y2="386" class="edge-base"/>

  <!-- L0 Beam Traversal Arrows -->
  <line x1="448" y1="382" x2="478" y2="364" class="beam-path" marker-end="url(#arrow-blue)"/>
  <line x1="504" y1="360" x2="529" y2="366" class="beam-path" marker-end="url(#arrow-blue)"/>
  <line x1="436" y1="400" x2="443" y2="418" class="beam-path" marker-end="url(#arrow-blue)"/>
  <line x1="462" y1="433" x2="546" y2="436" class="beam-path" marker-end="url(#arrow-blue)"/>

  <!-- L0 Nodes -->
  <circle cx="86" cy="418" r="13" fill="#1E293B" stroke="#64748B" stroke-width="1.6"/>
  <text x="86" y="418" class="mono node-id">v0</text>
  <circle cx="142" cy="408" r="13" fill="#1E293B" stroke="#64748B" stroke-width="1.6"/>
  <text x="142" y="408" class="mono node-id">v2</text>
  <circle cx="226" cy="438" r="13" fill="#1E293B" stroke="#64748B" stroke-width="1.6"/>
  <text x="226" y="438" class="mono node-id">v3</text>
  <circle cx="306" cy="380" r="13" fill="#1E293B" stroke="#64748B" stroke-width="1.6"/>
  <text x="306" y="380" class="mono node-id">v5</text>
  <circle cx="352" cy="438" r="13" fill="#1E293B" stroke="#64748B" stroke-width="1.6"/>
  <text x="352" y="438" class="mono node-id">v6</text>

  <!-- v7 L0 entry from L1 -->
  <circle cx="434" cy="386" r="13" fill="#0C4A6E" stroke="#38BDF8" stroke-width="2"/>
  <text x="434" y="386" class="mono node-id">v7</text>

  <!-- v10 Beam visited -->
  <circle cx="491" cy="356" r="13" fill="#1E3A8A" stroke="#60A5FA" stroke-width="2"/>
  <text x="491" y="356" class="mono node-id">v10</text>

  <!-- v8 Tombstoned / Filtered (traversed for connectivity, excluded from results!) -->
  <circle cx="448" cy="432" r="13" fill="#4C0519" stroke="#FB7185" stroke-width="1.8" stroke-dasharray="3 2"/>
  <text x="448" y="432" class="mono node-id" fill="#FB7185">v8</text>
  <text x="352" y="462" class="sans" font-size="10" fill="#FB7185" text-anchor="middle">tombstone: hop only</text>

  <!-- Top-k Results (v9, v11) -->
  <circle cx="544" cy="368" r="17" fill="none" stroke="#34D399" stroke-opacity="0.4" stroke-width="1.5"/>
  <circle cx="544" cy="368" r="13" fill="#064E3B" stroke="#34D399" stroke-width="2.2"/>
  <text x="544" y="368" class="mono node-id">v9</text>

  <circle cx="562" cy="436" r="17" fill="none" stroke="#34D399" stroke-opacity="0.4" stroke-width="1.5"/>
  <circle cx="562" cy="436" r="13" fill="#064E3B" stroke="#34D399" stroke-width="2.2"/>
  <text x="562" y="436" class="mono node-id">v11</text>
  <text x="570" y="404" class="mono" font-size="10.5" font-weight="700" fill="#34D399" text-anchor="middle" dominant-baseline="central">top-k</text>

  <!-- Right 4-Step Walkthrough Panel -->
  <rect x="640" y="78" width="292" height="82" rx="10" class="panel"/>
  <circle cx="662" cy="100" r="10" fill="#0C4A6E" stroke="#00ADD8" stroke-width="1.2"/>
  <text x="662" y="100" class="mono" font-size="11" font-weight="700" fill="#7DD3FC" text-anchor="middle" dominant-baseline="central">1</text>
  <text x="680" y="100" class="sans panel-title" dominant-baseline="central">Atomic Read &amp; entryState</text>
  <text x="654" y="124" class="sans label">Acquire P-local <tspan class="mono" fill="#38BDF8">readStripes</tspan> RLock.</text>
  <text x="654" y="143" class="sans muted">Load atomic <tspan class="mono">entryState</tspan> (entryLevel | id).</text>

  <rect x="640" y="170" width="292" height="88" rx="10" class="panel"/>
  <circle cx="662" cy="192" r="10" fill="#0C4A6E" stroke="#00ADD8" stroke-width="1.2"/>
  <text x="662" y="192" class="mono" font-size="11" font-weight="700" fill="#7DD3FC" text-anchor="middle" dominant-baseline="central">2</text>
  <text x="680" y="192" class="sans panel-title" dominant-baseline="central">Phase 1: greedyStep (LMax..1)</text>
  <text x="654" y="216" class="sans label">Greedily step to <tspan class="mono" fill="#38BDF8">d &lt; currDist</tspan> (<tspan class="mono">ef=1</tspan>).</text>
  <text x="654" y="236" class="sans muted">At local minimum, drop down to <tspan class="mono">lvl - 1</tspan>.</text>

  <rect x="640" y="268" width="292" height="114" rx="10" class="panel"/>
  <circle cx="662" cy="290" r="10" fill="#1E3A8A" stroke="#60A5FA" stroke-width="1.2"/>
  <text x="662" y="290" class="mono" font-size="11" font-weight="700" fill="#93C5FD" text-anchor="middle" dominant-baseline="central">3</text>
  <text x="680" y="290" class="sans panel-title" dominant-baseline="central">Phase 2: L0 Beam &amp; Scratch</text>
  <text x="654" y="314" class="mono label" fill="#93C5FD">ef = max(EfSearch, k)</text>
  <text x="654" y="333" class="sans muted">Pooled <tspan class="mono" fill="#CBD5E1">searchScratch</tspan>: <tspan class="mono">candidates</tspan> minHeap,</text>
  <text x="654" y="350" class="sans muted"><tspan class="mono">results</tspan> maxHeap, O(1) <tspan class="mono">visited</tspan> epoch stamp.</text>
  <text x="654" y="368" class="sans" font-size="10.5" fill="#FB7185">Tombstoned/filtered: traverse, skip results.</text>

  <rect x="640" y="392" width="292" height="80" rx="10" class="panel"/>
  <circle cx="662" cy="414" r="10" fill="#064E3B" stroke="#34D399" stroke-width="1.2"/>
  <text x="662" y="414" class="mono" font-size="11" font-weight="700" fill="#34D399" text-anchor="middle" dominant-baseline="central">4</text>
  <text x="680" y="414" class="sans panel-title" dominant-baseline="central">Return Top-k Results</text>
  <text x="654" y="438" class="sans label">Trim to <tspan class="mono" fill="#34D399">k</tspan>, Sqrt (L2), <tspan class="mono">WithMaxDistance</tspan>.</text>
  <text x="654" y="456" class="mono muted" fill="#34D399">SearchInto: 0 B/op, 0 allocs/op</text>

  <!-- Footer Legend Bar -->
  <rect x="28" y="484" width="904" height="34" rx="8" class="panel"/>
  <circle cx="48" cy="501" r="6" fill="#0C4A6E" stroke="#00ADD8" stroke-width="2"/>
  <text x="60" y="501" class="mono label" dominant-baseline="central">entryState</text>

  <polygon points="154,494 161,501 154,508 147,501" fill="#451A03" stroke="#FBBF24" stroke-width="1.6"/>
  <text x="167" y="501" class="sans label" dominant-baseline="central">Query q</text>

  <line x1="234" y1="501" x2="258" y2="501" stroke="#00ADD8" stroke-width="2.4" marker-end="url(#arrow-cyan)"/>
  <text x="266" y="501" class="sans label" dominant-baseline="central">Greedy (ef=1)</text>

  <line x1="364" y1="501" x2="388" y2="501" stroke="#60A5FA" stroke-width="2.2" marker-end="url(#arrow-blue)"/>
  <text x="396" y="501" class="sans label" dominant-baseline="central">L0 Beam (max(ef,k))</text>

  <circle cx="534" cy="501" r="6" fill="#064E3B" stroke="#34D399" stroke-width="2"/>
  <text x="546" y="501" class="sans label" dominant-baseline="central">Top-k Result</text>

  <circle cx="642" cy="501" r="6" fill="#4C0519" stroke="#FB7185" stroke-width="1.6" stroke-dasharray="3 2"/>
  <text x="654" y="501" class="sans label" dominant-baseline="central">Tombstone / Filtered (skip result)</text>
</svg>
