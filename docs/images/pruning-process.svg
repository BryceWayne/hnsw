<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-labelledby="title desc">
  <title id="title">Algorithm 4 Diversity Pruning (WithHeuristic)</title>
  <desc id="desc">Comparison of WithHeuristic(false) naive closest truncation vs WithHeuristic(true) Algorithm 4 diversity pruning in selectNeighborsWork: shadow check dist(e, s) &lt; dist(q, e), discarded backfill if len(selected) &lt; maxConn, and M / Mmax degree bounds.</desc>
  <defs>
    <style>
      .sans { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; }
      .mono { font-family: ui-monospace, 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', 'DejaVu Sans Mono', monospace; }
      .title { font-size: 20px; font-weight: 700; fill: #F8FAFC; }
      .subtitle { font-size: 12px; font-weight: 400; fill: #94A3B8; }
      .panel { fill: #152033; stroke: #293548; stroke-width: 1.25; }
      .panel-title { font-size: 12.5px; font-weight: 700; fill: #F8FAFC; }
      .label { font-size: 11.5px; font-weight: 500; fill: #E2E8F0; }
      .muted { font-size: 11px; font-weight: 400; fill: #94A3B8; }
      .node-id { font-size: 10.5px; font-weight: 700; fill: #F8FAFC; text-anchor: middle; dominant-baseline: central; }
      .edge-keep { stroke: #34D399; stroke-width: 2.3; fill: none; }
      .edge-prune { stroke: #FB7185; stroke-width: 1.9; stroke-dasharray: 5 4; fill: none; }
      .edge-cmp { stroke: #FBBF24; stroke-width: 1.8; stroke-dasharray: 4 3; fill: none; }
    </style>
    <marker id="arrow-emerald" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M 1 1.5 L 9 5 L 1 8.5 z" fill="#34D399"/>
    </marker>
    <marker id="arrow-rose" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M 1 1.5 L 9 5 L 1 8.5 z" fill="#FB7185"/>
    </marker>
  </defs>

  <!-- Outer Card -->
  <rect x="2" y="2" width="956" height="536" rx="14" fill="#0F172A" stroke="#334155" stroke-width="1.5"/>

  <!-- Header -->
  <text x="28" y="38" class="sans title">Algorithm 4 Diversity Pruning (WithHeuristic)</text>
  <text x="28" y="57" class="sans subtitle">selectNeighborsWork: naive nearest vs diversity check dist(e, s) &lt; dist(q, e) with discarded[] backfill</text>

  <!-- Brand Badge Pill -->
  <rect x="764" y="21" width="168" height="36" rx="8" fill="#0B172A" stroke="#00ADD8" stroke-opacity="0.75" stroke-width="1.25"/>
  <line x1="781" y1="34" x2="793" y2="34" stroke="#38BDF8" stroke-width="1.5"/>
  <line x1="781" y1="34" x2="787" y2="45" stroke="#00ADD8" stroke-width="1.5"/>
  <line x1="793" y1="34" x2="787" y2="45" stroke="#34D399" stroke-width="1.5"/>
  <circle cx="781" cy="34" r="2.7" fill="#00ADD8"/>
  <circle cx="793" cy="34" r="2.7" fill="#38BDF8"/>
  <circle cx="787" cy="45" r="2.7" fill="#34D399"/>
  <text x="804" y="39" class="mono" font-size="14" font-weight="700" fill="#38BDF8" dominant-baseline="central">hnsw</text>
  <line x1="848" y1="29" x2="848" y2="49" stroke="#334155" stroke-width="1.2"/>
  <text x="858" y="39" class="mono" font-size="11" font-weight="600" fill="#CBD5E1" dominant-baseline="central">Go • ANN</text>

  <!-- Left Panel: WithHeuristic(false) -->
  <rect x="28" y="78" width="440" height="394" rx="10" class="panel"/>
  <text x="46" y="102" class="sans panel-title" fill="#CBD5E1">Naive Closest: <tspan class="mono" fill="#FBBF24">WithHeuristic(false)</tspan></text>
  <rect x="380" y="88" width="70" height="22" rx="6" fill="#0B172A" stroke="#334155"/>
  <text x="415" y="99" class="mono" font-size="11" font-weight="600" fill="#E2E8F0" text-anchor="middle" dominant-baseline="central">max = 2</text>
  <text x="46" y="122" class="sans muted">Takes sorted work[:maxConn]; clusters in one sector</text>

  <!-- 2D Vector Space Frame Left -->
  <rect x="46" y="136" width="404" height="248" rx="8" fill="#0F172A" stroke="#293548"/>
  <!-- Unreachable sector highlight -->
  <path d="M 196 304 L 54 220 L 54 146 L 200 146 Z" fill="#FB7185" fill-opacity="0.06"/>
  <text x="164" y="164" class="sans" font-size="10.5" fill="#FB7185" text-anchor="middle">unreachable sector</text>

  <!-- Edges Left: q(196,304) -> c1(284,278), q -> c2(346,250), dropped d(86,174) -->
  <line x1="212" y1="299" x2="268" y2="283" class="edge-keep" marker-end="url(#arrow-emerald)"/>
  <line x1="210" y1="296" x2="331" y2="256" class="edge-keep" marker-end="url(#arrow-emerald)"/>
  <line x1="184" y1="290" x2="98" y2="188" class="edge-prune" marker-end="url(#arrow-rose)"/>
  <line x1="212" y1="303" x2="391" y2="295" stroke="#475569" stroke-width="1.2" stroke-dasharray="3 3"/>

  <!-- Distance Badges Left -->
  <text x="244" y="318" class="mono" font-size="10" fill="#34D399" text-anchor="middle">92</text>
  <text x="278" y="262" class="mono" font-size="10" fill="#34D399" text-anchor="middle">159</text>
  <text x="168" y="216" class="mono" font-size="10" fill="#FB7185" text-anchor="middle">170 (dropped)</text>

  <!-- Nodes Left -->
  <circle cx="196" cy="304" r="16" fill="#0C4A6E" stroke="#00ADD8" stroke-width="2.2"/>
  <text x="196" y="304" class="mono node-id">q</text>

  <circle cx="284" cy="278" r="14" fill="#064E3B" stroke="#34D399" stroke-width="2"/>
  <text x="284" y="278" class="mono node-id">c1</text>

  <circle cx="346" cy="250" r="14" fill="#064E3B" stroke="#34D399" stroke-width="2"/>
  <text x="346" y="250" class="mono node-id">c2</text>

  <circle cx="408" cy="294" r="13" fill="#1E293B" stroke="#64748B" stroke-width="1.5"/>
  <text x="408" y="294" class="mono node-id">c3</text>

  <circle cx="86" cy="174" r="14" fill="#4C0519" stroke="#FB7185" stroke-width="1.8" stroke-dasharray="3 2"/>
  <text x="86" y="174" class="mono node-id" fill="#FB7185">d</text>

  <!-- Bottom Summary Box Left -->
  <rect x="46" y="396" width="404" height="60" rx="8" fill="#0B172A" stroke="#293548"/>
  <text x="60" y="418" class="mono label" fill="#CBD5E1">selected = [c1, c2]  <tspan class="muted">(len == maxConn)</tspan></text>
  <text x="60" y="439" class="sans muted">Both edges point to same cluster; diverse node <tspan class="mono" fill="#FB7185">d</tspan> lost.</text>

  <!-- Right Panel: WithHeuristic(true) -->
  <rect x="492" y="78" width="440" height="394" rx="10" class="panel"/>
  <text x="510" y="102" class="sans panel-title" fill="#34D399">Algorithm 4: <tspan class="mono" fill="#34D399">WithHeuristic(true)</tspan></text>
  <rect x="826" y="88" width="88" height="22" rx="6" fill="#064E3B" stroke="#34D399"/>
  <text x="870" y="99" class="mono" font-size="11" font-weight="600" fill="#34D399" text-anchor="middle" dominant-baseline="central">default</text>
  <text x="510" y="122" class="sans muted">Keep <tspan class="mono" fill="#E2E8F0">e</tspan> iff <tspan class="mono" fill="#FBBF24">dist(e, s) ≥ dist(q, e)</tspan> ∀ <tspan class="mono" fill="#E2E8F0">s ∈ selected</tspan></text>

  <!-- 2D Vector Space Frame Right -->
  <rect x="510" y="136" width="404" height="248" rx="8" fill="#0F172A" stroke="#293548"/>
  <!-- Shadow Cone behind c1 covering c2, c3 -->
  <path d="M 748 278 L 896 200 L 896 346 Z" fill="#FB7185" fill-opacity="0.10" stroke="#FB7185" stroke-opacity="0.28" stroke-dasharray="4 3"/>
  <text x="848" y="364" class="sans" font-size="10.5" fill="#FB7185" text-anchor="middle">shadowed zone</text>

  <!-- Edges Right: q(660,304) -> c1(748,278), q -> d(550,174), pruned q->c2(810,250), compare c1 & c2 -->
  <line x1="676" y1="299" x2="732" y2="283" class="edge-keep" marker-end="url(#arrow-emerald)"/>
  <line x1="648" y1="290" x2="562" y2="188" class="edge-keep" marker-end="url(#arrow-emerald)"/>
  <line x1="674" y1="296" x2="794" y2="256" class="edge-prune" marker-end="url(#arrow-rose)"/>
  <line x1="762" y1="272" x2="796" y2="256" class="edge-cmp"/>

  <!-- Distance Annotations Right -->
  <text x="706" y="302" class="mono" font-size="10" fill="#34D399" text-anchor="middle">92</text>
  <text x="634" y="216" class="mono" font-size="10" fill="#34D399" text-anchor="middle">170 (kept!)</text>
  <rect x="668" y="186" width="184" height="22" rx="4" fill="#451A03" stroke="#FBBF24" stroke-opacity="0.65"/>
  <text x="760" y="197" class="mono" font-size="9.5" fill="#FBBF24" text-anchor="middle" dominant-baseline="central">d(c2,c1)=68 &lt; d(q,c2)=159</text>
  <line x1="774" y1="208" x2="778" y2="262" stroke="#FBBF24" stroke-width="1" stroke-dasharray="2 2"/>

  <!-- Nodes Right -->
  <circle cx="660" cy="304" r="16" fill="#0C4A6E" stroke="#00ADD8" stroke-width="2.2"/>
  <text x="660" y="304" class="mono node-id">q</text>

  <circle cx="748" cy="278" r="14" fill="#064E3B" stroke="#34D399" stroke-width="2"/>
  <text x="748" y="278" class="mono node-id">c1</text>

  <circle cx="810" cy="250" r="14" fill="#4C0519" stroke="#FB7185" stroke-width="1.8" stroke-dasharray="3 2"/>
  <text x="810" y="250" class="mono node-id" fill="#FB7185">c2</text>

  <circle cx="872" cy="294" r="13" fill="#4C0519" stroke="#FB7185" stroke-opacity="0.65" stroke-width="1.4" stroke-dasharray="3 2"/>
  <text x="872" y="294" class="mono node-id" fill="#FB7185">c3</text>

  <circle cx="550" cy="174" r="14" fill="#064E3B" stroke="#34D399" stroke-width="2"/>
  <text x="550" y="174" class="mono node-id">d</text>

  <!-- Bottom Summary Box Right -->
  <rect x="510" y="396" width="404" height="60" rx="8" fill="#0B172A" stroke="#293548"/>
  <text x="524" y="418" class="mono label" fill="#34D399">selected = [c1, d]  •  <tspan fill="#FB7185">discarded = [c2, c3]</tspan></text>
  <text x="524" y="439" class="sans muted">Backfills from <tspan class="mono">discarded[]</tspan> if <tspan class="mono">len(selected) &lt; M/Mmax</tspan>.</text>

  <!-- Footer Legend Bar -->
  <rect x="28" y="484" width="904" height="34" rx="8" class="panel"/>
  <circle cx="48" cy="501" r="6" fill="#0C4A6E" stroke="#00ADD8" stroke-width="2"/>
  <text x="60" y="501" class="sans label" dominant-baseline="central">Base Node q</text>

  <line x1="154" y1="501" x2="180" y2="501" stroke="#34D399" stroke-width="2.3" marker-end="url(#arrow-emerald)"/>
  <text x="188" y="501" class="sans label" dominant-baseline="central">Selected Neighbor (s)</text>

  <line x1="340" y1="501" x2="366" y2="501" stroke="#FB7185" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#arrow-rose)"/>
  <text x="374" y="501" class="sans label" dominant-baseline="central">Shadowed (discarded[])</text>

  <line x1="554" y1="501" x2="578" y2="501" stroke="#FBBF24" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="586" y="501" class="mono label" dominant-baseline="central">dist(e, s) &lt; dist(q, e)</text>

  <text x="794" y="501" class="mono muted" dominant-baseline="central">M=16 • Mmax=32</text>
</svg>
