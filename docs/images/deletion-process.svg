<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-labelledby="title desc">
  <title id="title">HNSW Deletion Lifecycle, 2-Hop Repair and Compact()</title>
  <desc id="desc">Hybrid Delete and DeleteBatch lifecycle in Go: markDeleted atomic tombstone bitset and extToInt unmap, removeEdge unlink, addConnectionsBatch 2-hop repair with Algorithm 4 pruning and electEntryPoint, and Compact() dense oldToNew arena reclamation.</desc>
  <defs>
    <style>
      .sans { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; }
      .mono { font-family: ui-monospace, 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', 'DejaVu Sans Mono', monospace; }
      .title { font-size: 20px; font-weight: 700; fill: #F8FAFC; }
      .subtitle { font-size: 12px; font-weight: 400; fill: #94A3B8; }
      .panel { fill: #152033; stroke: #293548; stroke-width: 1.25; }
      .panel-title { font-size: 12.5px; font-weight: 700; fill: #F8FAFC; }
      .label { font-size: 11.5px; font-weight: 500; fill: #E2E8F0; }
      .muted { font-size: 11px; font-weight: 400; fill: #94A3B8; }
      .node-id { font-size: 10.5px; font-weight: 700; fill: #F8FAFC; text-anchor: middle; dominant-baseline: central; }
      .edge-base { stroke: #64748B; stroke-width: 1.4; fill: none; }
      .edge-unlink { stroke: #FB7185; stroke-width: 1.8; stroke-dasharray: 4 3; fill: none; }
      .edge-repair { stroke: #60A5FA; stroke-width: 2.1; fill: none; }
    </style>
    <marker id="arrow-cyan" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M 1 1.5 L 9 5 L 1 8.5 z" fill="#00ADD8"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M 1 1.5 L 9 5 L 1 8.5 z" fill="#60A5FA"/>
    </marker>
  </defs>

  <!-- Outer Card -->
  <rect x="2" y="2" width="956" height="536" rx="14" fill="#0F172A" stroke="#334155" stroke-width="1.5"/>

  <!-- Header -->
  <text x="28" y="38" class="sans title">Deletion Lifecycle, 2-Hop Repair &amp; Compact()</text>
  <text x="28" y="57" class="sans subtitle">Delete / DeleteBatch: atomic tombstone bitset, removeEdge, addConnectionsBatch repair, and dense Compact()</text>

  <!-- Brand Badge Pill -->
  <rect x="764" y="21" width="168" height="36" rx="8" fill="#0B172A" stroke="#00ADD8" stroke-opacity="0.75" stroke-width="1.25"/>
  <line x1="781" y1="34" x2="793" y2="34" stroke="#38BDF8" stroke-width="1.5"/>
  <line x1="781" y1="34" x2="787" y2="45" stroke="#00ADD8" stroke-width="1.5"/>
  <line x1="793" y1="34" x2="787" y2="45" stroke="#34D399" stroke-width="1.5"/>
  <circle cx="781" cy="34" r="2.7" fill="#00ADD8"/>
  <circle cx="793" cy="34" r="2.7" fill="#38BDF8"/>
  <circle cx="787" cy="45" r="2.7" fill="#34D399"/>
  <text x="804" y="39" class="mono" font-size="14" font-weight="700" fill="#38BDF8" dominant-baseline="central">hnsw</text>
  <line x1="848" y1="29" x2="848" y2="49" stroke="#334155" stroke-width="1.2"/>
  <text x="858" y="39" class="mono" font-size="11" font-weight="600" fill="#CBD5E1" dominant-baseline="central">Go • ANN</text>

  <!-- Panel 1: Tombstone & Unlink -->
  <rect x="28" y="78" width="286" height="394" rx="10" class="panel"/>
  <circle cx="50" cy="100" r="10" fill="#4C0519" stroke="#FB7185" stroke-width="1.2"/>
  <text x="50" y="100" class="mono" font-size="11" font-weight="700" fill="#FB7185" text-anchor="middle" dominant-baseline="central">1</text>
  <text x="68" y="100" class="sans panel-title" dominant-baseline="central">Tombstone &amp; Unlink</text>
  <text x="44" y="122" class="mono muted" fill="#FB7185">Delete(id) / DeleteBatch(ids)</text>

  <!-- Graph Box 1 -->
  <rect x="44" y="136" width="254" height="196" rx="8" fill="#0F172A" stroke="#293548"/>
  <!-- Outer neighbor ring edges -->
  <line x1="90" y1="184" x2="104" y2="286" class="edge-base"/>
  <line x1="252" y1="184" x2="238" y2="286" class="edge-base"/>
  <!-- Unlinked edges to v_del(171,234) -->
  <line x1="90" y1="184" x2="171" y2="234" class="edge-unlink"/>
  <line x1="252" y1="184" x2="171" y2="234" class="edge-unlink"/>
  <line x1="104" y1="286" x2="171" y2="234" class="edge-unlink"/>
  <line x1="238" y1="286" x2="171" y2="234" class="edge-unlink"/>

  <!-- Nodes 1 -->
  <circle cx="90" cy="184" r="14" fill="#1E293B" stroke="#64748B" stroke-width="1.75"/>
  <text x="90" y="184" class="mono node-id">a</text>
  <circle cx="252" cy="184" r="14" fill="#1E293B" stroke="#64748B" stroke-width="1.75"/>
  <text x="252" y="184" class="mono node-id">b</text>
  <circle cx="104" cy="286" r="14" fill="#1E293B" stroke="#64748B" stroke-width="1.75"/>
  <text x="104" y="286" class="mono node-id">c</text>
  <circle cx="238" cy="286" r="14" fill="#1E293B" stroke="#64748B" stroke-width="1.75"/>
  <text x="238" y="286" class="mono node-id">d</text>

  <circle cx="171" cy="234" r="17" fill="#4C0519" stroke="#FB7185" stroke-width="2" stroke-dasharray="4 2"/>
  <text x="171" y="234" class="mono node-id" fill="#FB7185">✕</text>
  <rect x="122" y="152" width="98" height="18" rx="4" fill="#4C0519" stroke="#FB7185" stroke-opacity="0.6"/>
  <text x="171" y="161" class="mono" font-size="9.5" fill="#FB7185" text-anchor="middle" dominant-baseline="central">tombstone = 1</text>

  <!-- Detail Box 1 -->
  <rect x="44" y="344" width="254" height="114" rx="8" fill="#0B172A" stroke="#293548"/>
  <text x="56" y="365" class="mono label" fill="#FB7185">markDeleted(oldID)</text>
  <text x="56" y="384" class="sans muted">Flip bit in <tspan class="mono">arenaChunk.deleted[slot&gt;&gt;6]</tspan></text>
  <text x="56" y="401" class="sans muted">and unmap <tspan class="mono">delete(extToInt, id)</tspan>.</text>
  <text x="56" y="424" class="mono label" fill="#E2E8F0">removeEdge(u, oldID, lvl)</text>
  <text x="56" y="443" class="sans muted">Strip incoming edges at <tspan class="mono">0..oldMaxLvl</tspan>.</text>

  <!-- Panel 2: 2-Hop Repair & Entry -->
  <rect x="337" y="78" width="286" height="394" rx="10" class="panel"/>
  <circle cx="359" cy="100" r="10" fill="#1E3A8A" stroke="#60A5FA" stroke-width="1.2"/>
  <text x="359" y="100" class="mono" font-size="11" font-weight="700" fill="#93C5FD" text-anchor="middle" dominant-baseline="central">2</text>
  <text x="377" y="100" class="sans panel-title" dominant-baseline="central">2-Hop Repair &amp; Entry</text>
  <text x="353" y="122" class="mono muted" fill="#60A5FA">addConnectionsBatch + electEntry</text>

  <!-- Graph Box 2 -->
  <rect x="353" y="136" width="254" height="196" rx="8" fill="#0F172A" stroke="#293548"/>
  <line x1="399" y1="184" x2="413" y2="286" class="edge-base"/>
  <line x1="561" y1="184" x2="547" y2="286" class="edge-base"/>
  <!-- Ghost deleted node -->
  <circle cx="480" cy="234" r="15" fill="#4C0519" fill-opacity="0.25" stroke="#FB7185" stroke-opacity="0.55" stroke-width="1.4" stroke-dasharray="3 3"/>
  <text x="480" y="234" class="mono" font-size="10" fill="#FDA4AF" fill-opacity="0.92" text-anchor="middle" dominant-baseline="central">old</text>

  <!-- 2-hop repair bidirectional intra-layer edges -->
  <line x1="415" y1="184" x2="545" y2="184" class="edge-repair" marker-start="url(#arrow-blue)" marker-end="url(#arrow-blue)"/>
  <line x1="429" y1="286" x2="531" y2="286" class="edge-repair" marker-start="url(#arrow-blue)" marker-end="url(#arrow-blue)"/>
  <path d="M 412 197 Q 496 202 536 272" class="edge-repair" marker-start="url(#arrow-blue)" marker-end="url(#arrow-blue)"/>

  <rect x="412" y="150" width="136" height="18" rx="4" fill="#1E3A8A" stroke="#60A5FA" stroke-opacity="0.7"/>
  <text x="480" y="159" class="mono" font-size="9.5" fill="#93C5FD" text-anchor="middle" dominant-baseline="central">2-hop bridge (Alg.4)</text>

  <!-- Nodes 2 -->
  <circle cx="399" cy="184" r="14" fill="#0C4A6E" stroke="#60A5FA" stroke-width="2"/>
  <text x="399" y="184" class="mono node-id">a</text>
  <circle cx="561" cy="184" r="14" fill="#0C4A6E" stroke="#60A5FA" stroke-width="2"/>
  <text x="561" y="184" class="mono node-id">b</text>
  <circle cx="413" cy="286" r="14" fill="#0C4A6E" stroke="#60A5FA" stroke-width="2"/>
  <text x="413" y="286" class="mono node-id">c</text>
  <circle cx="547" cy="286" r="14" fill="#0C4A6E" stroke="#60A5FA" stroke-width="2"/>
  <text x="547" y="286" class="mono node-id">d</text>

  <!-- Detail Box 2 -->
  <rect x="353" y="344" width="254" height="114" rx="8" fill="#0B172A" stroke="#293548"/>
  <text x="365" y="365" class="mono label" fill="#93C5FD">addConnectionsBatch(u, liveNbrs)</text>
  <text x="365" y="384" class="sans muted">Rebridges surviving neighbors &amp; prunes</text>
  <text x="365" y="401" class="sans muted">via Algorithm 4 if degree &gt; <tspan class="mono">M / Mmax</tspan>.</text>
  <text x="365" y="424" class="mono label" fill="#38BDF8">electEntryPoint()</text>
  <text x="365" y="443" class="sans muted">If <tspan class="mono">entryID == oldID</tspan>, pick max live lvl.</text>

  <!-- Panel 3: Compact() Arena Reclamation -->
  <rect x="646" y="78" width="286" height="394" rx="10" class="panel"/>
  <circle cx="668" cy="100" r="10" fill="#064E3B" stroke="#34D399" stroke-width="1.2"/>
  <text x="668" y="100" class="mono" font-size="11" font-weight="700" fill="#34D399" text-anchor="middle" dominant-baseline="central">3</text>
  <text x="686" y="100" class="sans panel-title" dominant-baseline="central">Reclaim Arena Slots</text>
  <text x="662" y="122" class="mono muted" fill="#34D399">Compact() • oldToNew remap</text>

  <!-- Arena Slots Box 3 -->
  <rect x="662" y="136" width="254" height="196" rx="8" fill="#0F172A" stroke="#293548"/>
  <text x="676" y="156" class="sans muted">Before: <tspan class="mono" fill="#E2E8F0">live=4</tspan>, <tspan class="mono" fill="#FB7185">Deleted=2</tspan></text>

  <!-- 6 Slots Before: 672, 711, 750, 789, 828, 867 (w=34, gap=5) -->
  <rect x="672" y="168" width="34" height="34" rx="5" fill="#0C4A6E" stroke="#38BDF8" stroke-width="1.3"/>
  <text x="689" y="185" class="mono node-id">0</text>
  <rect x="711" y="168" width="34" height="34" rx="5" fill="#0C4A6E" stroke="#38BDF8" stroke-width="1.3"/>
  <text x="728" y="185" class="mono node-id">1</text>
  <rect x="750" y="168" width="34" height="34" rx="5" fill="#4C0519" stroke="#FB7185" stroke-width="1.3" stroke-dasharray="3 2"/>
  <text x="767" y="185" class="mono node-id" fill="#FB7185">✕</text>
  <rect x="789" y="168" width="34" height="34" rx="5" fill="#0C4A6E" stroke="#38BDF8" stroke-width="1.3"/>
  <text x="806" y="185" class="mono node-id">3</text>
  <rect x="828" y="168" width="34" height="34" rx="5" fill="#4C0519" stroke="#FB7185" stroke-width="1.3" stroke-dasharray="3 2"/>
  <text x="845" y="185" class="mono node-id" fill="#FB7185">✕</text>
  <rect x="867" y="168" width="34" height="34" rx="5" fill="#0C4A6E" stroke="#38BDF8" stroke-width="1.3"/>
  <text x="884" y="185" class="mono node-id">5</text>

  <!-- Downward Compact Arrow -->
  <line x1="789" y1="212" x2="789" y2="246" stroke="#00ADD8" stroke-width="2" marker-end="url(#arrow-cyan)"/>
  <rect x="800" y="219" width="96" height="18" rx="4" fill="#0B172A" stroke="#00ADD8" stroke-opacity="0.6"/>
  <text x="848" y="228" class="mono" font-size="9.5" fill="#38BDF8" text-anchor="middle" dominant-baseline="central">Compact()</text>

  <!-- 4 Compact Slots After + 2 Reclaimed -->
  <rect x="672" y="256" width="34" height="34" rx="5" fill="#064E3B" stroke="#34D399" stroke-width="1.5"/>
  <text x="689" y="273" class="mono node-id">0</text>
  <rect x="711" y="256" width="34" height="34" rx="5" fill="#064E3B" stroke="#34D399" stroke-width="1.5"/>
  <text x="728" y="273" class="mono node-id">1</text>
  <rect x="750" y="256" width="34" height="34" rx="5" fill="#064E3B" stroke="#34D399" stroke-width="1.5"/>
  <text x="767" y="273" class="mono node-id">2</text>
  <rect x="789" y="256" width="34" height="34" rx="5" fill="#064E3B" stroke="#34D399" stroke-width="1.5"/>
  <text x="806" y="273" class="mono node-id">3</text>
  <rect x="828" y="256" width="73" height="34" rx="5" fill="#0B172A" stroke="#334155" stroke-dasharray="4 3"/>
  <text x="864" y="273" class="sans" font-size="10" fill="#94A3B8" text-anchor="middle" dominant-baseline="central">freed</text>

  <text x="676" y="314" class="sans muted">After: <tspan class="mono" fill="#34D399">IDs 0..3</tspan>, <tspan class="mono" fill="#34D399">Deleted=0</tspan></text>

  <!-- Detail Box 3 -->
  <rect x="662" y="344" width="254" height="114" rx="8" fill="#0B172A" stroke="#293548"/>
  <text x="674" y="365" class="mono label" fill="#34D399">oldToNew dense remap</text>
  <text x="674" y="384" class="sans muted">Allocates fresh <tspan class="mono">arenaChunk</tspan>s, copies live</text>
  <text x="674" y="401" class="sans muted"><tspan class="mono">vecs</tspan> &amp; <tspan class="mono">invNorms</tspan>, remaps <tspan class="mono">l0Edges</tspan> +</text>
  <text x="674" y="418" class="sans muted"><tspan class="mono">upperLevels</tspan> and updates <tspan class="mono">entryState</tspan>.</text>
  <text x="674" y="441" class="mono" font-size="10" fill="#CBD5E1">3 → 2, 5 → 3  (tombstoneCount = 0)</text>

  <!-- Panel Flow Arrows -->
  <line x1="317" y1="234" x2="333" y2="234" stroke="#00ADD8" stroke-width="2" marker-end="url(#arrow-cyan)"/>
  <line x1="626" y1="234" x2="642" y2="234" stroke="#00ADD8" stroke-width="2" marker-end="url(#arrow-cyan)"/>

  <!-- Footer Legend Bar -->
  <rect x="28" y="484" width="904" height="34" rx="8" class="panel"/>
  <circle cx="48" cy="501" r="6" fill="#4C0519" stroke="#FB7185" stroke-width="1.6" stroke-dasharray="3 2"/>
  <text x="60" y="501" class="sans label" dominant-baseline="central">Tombstoned (deleted bitset)</text>

  <line x1="252" y1="501" x2="278" y2="501" stroke="#FB7185" stroke-width="1.9" stroke-dasharray="4 3"/>
  <text x="286" y="501" class="sans label" dominant-baseline="central">Unlinked (removeEdge)</text>

  <circle cx="446" cy="501" r="6" fill="#0C4A6E" stroke="#60A5FA" stroke-width="2"/>
  <text x="458" y="501" class="sans label" dominant-baseline="central">Surviving Neighbor</text>

  <line x1="596" y1="501" x2="622" y2="501" stroke="#60A5FA" stroke-width="2.1" marker-end="url(#arrow-blue)"/>
  <text x="630" y="501" class="sans label" dominant-baseline="central">2-Hop Repair</text>

  <rect x="734" y="494" width="14" height="14" rx="3" fill="#064E3B" stroke="#34D399" stroke-width="1.3"/>
  <text x="755" y="501" class="sans label" dominant-baseline="central">Compacted Slot</text>
</svg>
