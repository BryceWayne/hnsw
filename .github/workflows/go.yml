name: Go

on:
  push:
    branches: [ "main", "master", "root" ]
  pull_request:
    branches: [ "main", "master", "root" ]

permissions:
  contents: read

jobs:
  test:
    name: Test & Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Check formatting (gofmt)
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Files not formatted with gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Verify go.mod
        run: go mod verify

      - name: Vet
        run: go vet ./...

      - name: Test (race)
        run: go test -race -v ./...

      - name: Test (purego + race)
        run: go test -tags purego -race ./...

      - name: Fuzz smoke test (ReadFrom)
        run: go test -fuzz=FuzzReadFrom -fuzztime=5s .

      - name: Build examples
        run: go build -o /dev/null ./examples

      - name: Benchmark smoke test
        run: go test -run=^$ -bench=. -benchtime=1x ./...

  test-arm64:
    name: Native ARM64 (NEON + Race)
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Vet
        run: go vet ./...

      - name: Test NEON + Race
        run: go test -race -v -run='TestNEONKernelParity|TestRecall10K|TestSearchZeroAllocs|TestSearchIntoZeroAllocs' . ./internal/simd && go test -race ./...

      - name: Test PureGo + Race
        run: go test -tags purego -race ./...

      - name: Benchmark NEON vs PureGo
        run: go test -run=^$ -bench=BenchmarkDistanceNEONVsFallback -benchmem -benchtime=100ms ./internal/simd

  cross-build:
    name: Cross-Platform Build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Vet & Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          go vet ./...
          go build ./...

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.1
          args: --timeout=5m

  vulncheck:
    name: Vulnerability Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
